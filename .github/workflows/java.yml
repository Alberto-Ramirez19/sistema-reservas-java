name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar y ejecutar pruebas
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sistema-reservas-java
          path: build/sistema-reservas.jar
